<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <aside class="sidebar">
    <h1>Expense Tracker</h1>
    <button type="button" id="theme-button">Dark mode</button>

    <p>Total spent</p>
    <p id="total">0</p>

    <h2>By category</h2>
    <ul id="category-list"></ul>
  </aside>

  <main>
    <h2 id="form-title">Add an expense</h2>
    <form id="expense-form" novalidate>
      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title">
        <p class="error" id="title-error"></p>
      </div>
      <div class="field">
        <label for="amount">Amount</label>
        <input type="number" id="amount" step="0.01">
        <p class="error" id="amount-error"></p>
      </div>
      <div class="field">
        <label for="date">Date</label>
        <input type="date" id="date">
        <p class="error" id="date-error"></p>
      </div>
      <div class="field">
        <label for="category">Category</label>
        <select id="category"></select>
        <p class="error" id="category-error"></p>
      </div>
      <div class="buttons">
        <button type="submit" id="save-button">Add expense</button>
        <button type="button" id="cancel-button" hidden>Cancel</button>
      </div>
    </form>

    <h2>All expenses</h2>
    <div class="filters">
      <div class="field">
        <label for="filter-category">Category</label>
        <select id="filter-category"></select>
      </div>
      <div class="field">
        <label for="filter-month">Month</label>
        <input type="month" id="filter-month">
      </div>
      <div class="field">
        <label for="sort-by">Sort by</label>
        <select id="sort-by">
          <option value="date-new">Date: newest first</option>
          <option value="date-old">Date: oldest first</option>
          <option value="amount-high">Amount: high to low</option>
          <option value="amount-low">Amount: low to high</option>
        </select>
      </div>
      <button type="button" id="clear-button">Clear filters</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Category</th>
            <th>Date</th>
            <th>Amount</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="expense-table"></tbody>
      </table>
    </div>
    <p id="empty-message" hidden></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
